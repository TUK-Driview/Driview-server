name: CI/CD for Spring Boot
on:
  push:
    branches:
      - dev
permissions:
  contents: read
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4
      # 2. Java 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      # 3. gradlew 실행 권한
      - name: Grant execute permission
        run: chmod +x gradlew
      # 4. 빌드
      - name: Build with Gradle
        run: ./gradlew clean build -x test
      # 5. Docker Hub 로그인
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      # 6. buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # 7. Docker 이미지 빌드 + Push
      - name: Build and Push
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t ${{ secrets.DOCKER_USERNAME }}/driview:latest \
            --push .
      # 8. EC2 배포
      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/maum:latest
            sudo docker stop maum || true
            sudo docker rm maum || true
            sudo docker run -d \
              --name driview \
              -p 8080:8080 \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e SPRING_PROFILES_ACTIVE=prod \
              ${{ secrets.DOCKER_USERNAME }}/driview:latest
            sudo docker image prune -af